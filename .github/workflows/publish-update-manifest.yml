# 为已发布的 Release 生成 rustdesk-update.json 与 ed25519 签名并上传。
# 1.5.1+ 的客户端在下载更新前会先校验这两份文件，缺了就拿不到更新。
#
# 签名复用上游的 res/update/generate_update_metadata.py（同步时自动跟进上游 schema），
# 本文件只做编排：挑出发布里存在的安装包 → 下载 → 签名 → 上传。
#
# 需要的仓库配置：
#   secret    RUSTDESK_UPDATE_ED25519_SEED        32 字节 seed 的 base64
#   variable  RUSTDESK_UPDATE_ED25519_PUBLIC_KEY  32 字节公钥的 base64（需与 src/update_metadata.rs 内嵌值一致）
name: Publish Update Manifest

on:
  workflow_call:
    inputs:
      version:
        description: "要生成清单的 Release tag（纯版本号，如 1.5.3）"
        required: true
        type: string
    secrets:
      RUSTDESK_UPDATE_ED25519_SEED:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "要补建清单的 Release tag（纯版本号，如 1.5.3）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-manifest-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Sign and upload manifest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install update metadata dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Check signing key material
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${RUSTDESK_UPDATE_ED25519_SEED:?缺少 secret RUSTDESK_UPDATE_ED25519_SEED}"
          : "${RUSTDESK_UPDATE_ED25519_PUBLIC_KEY:?缺少 variable RUSTDESK_UPDATE_ED25519_PUBLIC_KEY}"
          # 校验 seed 与公钥匹配，且与 src/update_metadata.rs 内嵌的公钥一致
          python res/update/generate_update_metadata.py check-key

      - name: Generate and upload rustdesk-update.json
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python3 .github/custom/publish-update-manifest.py --version "${{ inputs.version }}"
